server:
  port: 7008

spring:
  application:
    name: whodas-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whodas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp-mail.outlook.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:giuseppe_cerbone@hotmail.com}
    password: ${MAIL_PASSWORD:GiuCerbone_1234$}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:true}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost}

keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:whodas-realm}
    admin-client-id: admin-cli
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    ldap-provider-id: ${KEYCLOAK_LDAP_PROVIDER_ID:a81a47e5-121c-4d8b-b480-3b6e1029f267}

ldap:
  url: ${LDAP_URL:ldap://localhost:389}
  bind-dn: cn=admin,dc=whodascompany,dc=local
  bind-password: ${LDAP_ADMIN_PASSWORD:admin}
  base-dn: dc=whodascompany,dc=local
  users-dn: ou=users,dc=whodascompany,dc=local

logging:
  file:
    name: ${LOG_PATH:../logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    it.whodas.userservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
