[program:fix-mynetworks]
startsecs=0
stopwaitsecs=5
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/bin/bash -c "sleep 10 && postconf -e 'mynetworks = 127.0.0.0/8 172.18.0.0/16 10.0.0.0/8 192.168.0.0/16' && postfix reload"