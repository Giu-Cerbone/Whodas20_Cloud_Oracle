<div class="login-container">
  <div class="login-card">
    <h2><i class="fas fa-stethoscope me-2"></i>WHODAS 2.0</h2>
    <p class="subtitle">Accesso al sistema</p>

    <div class="alert alert-success" *ngIf="registered">Registrazione completata con successo! Ora puoi accedere con le tue credenziali.</div>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          class="form-control"
          placeholder="Inserisci username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          class="form-control"
          placeholder="Inserisci password"
        >
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading || !loginForm.form.valid">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Accedi</span>
      </button>
    </form>

    <div class="d-flex justify-content-between mt-3">
      <button type="button" class="btn btn-link p-0" (click)="openForgotPassword()">Password dimenticata?</button>
      <button type="button" class="btn btn-outline-secondary" (click)="goRegister()">
        Nuova registrazione
      </button>
    </div>
    
    <div class="text-center mt-3">
      <button type="button" class="btn btn-link" (click)="openGuideline()">
        <i class="fas fa-book me-1"></i> Manuale Utente
      </button>
    </div>
  </div>
</div>

<app-guideline-modal [isOpen]="showGuideline" (closed)="onGuidelineClose()"></app-guideline-modal>

<app-user-profile-modal [isOpen]="showUserProfile" [user]="authService.getCurrentUser()" (closed)="showUserProfile = false"></app-user-profile-modal>

<app-forgot-password-modal [isOpen]="showForgotPassword" (closed)="onForgotPasswordClose()"></app-forgot-password-modal>

<div class="modal-backdrop fade show" *ngIf="showErrorModal" (click)="closeErrorModal()"></div>
<div class="modal d-block login-error-modal" *ngIf="showErrorModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="loginErrorLabel">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="loginErrorLabel"><i class="fas fa-exclamation-triangle me-2"></i>Accesso non riuscito</h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeErrorModal()" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        {{ errorMessage }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="closeErrorModal()">OK</button>
      </div>
    </div>
  </div>
</div>
