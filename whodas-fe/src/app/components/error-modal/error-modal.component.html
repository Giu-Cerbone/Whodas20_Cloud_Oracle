<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="error" (keydown.escape)="onClose()">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle me-2"></i>{{ getErrorTitle() }}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <i class="fas fa-exclamation-circle fa-3x text-danger"></i>
        </div>
        <p class="text-center mb-2">{{ error.message }}</p>
        <div class="mt-3 p-2 bg-light rounded small">
          <div><strong>Codice:</strong> {{ error.code || 'N/A' }}</div>
          <div><strong>Stato:</strong> {{ error.status || 'N/A' }}</div>
          <div><strong>Percorso:</strong> {{ error.path || 'N/A' }}</div>
          <div><strong>Orario:</strong> {{ error.timestamp | date:'dd/MM/yyyy HH:mm' }}</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Chiudi</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="error" (click)="onClose()"></div>
