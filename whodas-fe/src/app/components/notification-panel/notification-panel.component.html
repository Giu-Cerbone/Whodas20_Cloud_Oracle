<div class="notification-wrapper">
  <button type="button" class="btn btn-outline-light btn-sm position-relative" (click)="togglePanel()" title="Vedi Notifiche">
    <i class="fas fa-bell me-1"></i>
    <span *ngIf="unreadCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="notification-dropdown" *ngIf="isOpen">
    <div class="dropdown-header d-flex justify-content-between align-items-center">
      <span class="fw-bold">Notifiche</span>
      <div>
        <button *ngIf="unreadCount > 0" class="btn btn-sm btn-outline-primary" (click)="markAllAsRead()">
          <i class="fas fa-check-double me-1"></i>Marcare tutte lette
        </button>
        <a class="btn btn-sm btn-outline-secondary" routerLink="/notifications" (click)="closePanel()">
          <i class="fas fa-list me-1"></i>Gestisci
        </a>
      </div>
    </div>

    <div class="notification-list">
      <div *ngIf="unreadCount === 0 && notifications.length === 0" class="notification-empty text-center py-4">
        <i class="fas fa-bell-slash fa-2x text-muted mb-2"></i>
        <p class="text-muted small">Nessuna notifica</p>
      </div>

      <div *ngFor="let notification of notifications; trackBy: trackByIdx"
           class="notification-item"
           [class.notification-unread]="notification.dataLettura === null"
           (click)="openNotification(notification)">
        <div class="notification-icon">
          <i *ngIf="notification.typeMessage === 'Warning'" class="fas fa-exclamation-triangle text-warning"></i>
          <i *ngIf="notification.typeMessage === 'Info'" class="fas fa-info-circle text-info"></i>
          <i *ngIf="notification.typeMessage === 'Error'" class="fas fa-exclamation-circle text-danger"></i>
          <i *ngIf="notification.typeMessage !== 'Warning' && notification.typeMessage !== 'Info' && notification.typeMessage !== 'Error'" class="fas fa-bell text-primary"></i>
        </div>
        <div class="notification-content">
          <div class="notification-oggetto" title="{{ notification.oggetto }}">
            {{ notification.oggetto }}
          </div>
          <div class="notification-description" title="{{ notification.description }}">
            {{ notification.description | slice: 0:100 }}<span *ngIf="notification.description.length > 100">...</span>
          </div>
          <div class="notification-time">
            <i class="fas fa-clock me-1"></i>{{ notification.dataSpedizione | date:'dd/MM/yyyy HH:mm' }}
          </div>
        </div>
        <button class="btn btn-sm btn-outline-secondary notification-delete" (click)="$event.stopPropagation(); deleteNotification(notification)" title="Elimina">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <div class="dropdown-footer" *ngIf="notifications.length > 0">
      <a class="btn btn-sm btn-outline-primary w-100" routerLink="/notifications" [queryParams]="{ filter: 'all' }" (click)="closePanel()">
        <i class="fas fa-layer-group me-1"></i>Vedi tutte le notifiche
      </a>
    </div>
  </div>
</div>
