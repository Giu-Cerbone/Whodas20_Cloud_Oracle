<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="alert" (keydown.escape)="onClose()">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" [ngClass]="isDanger() ? 'bg-danger text-white' : 'bg-warning text-dark'">
        <h5 class="modal-title">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ getTitle() }}
        </h5>
        <button type="button" class="btn-close" [ngClass]="{'btn-close-white': isDanger()}" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <i class="bi bi-exclamation-triangle-fill alert-icon" [ngClass]="isDanger() ? 'text-danger' : 'text-warning'"></i>
        </div>
        <p class="text-center mb-0">{{ alert.message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">OK</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="alert" (click)="onClose()"></div>
