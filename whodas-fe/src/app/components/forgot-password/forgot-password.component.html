<div class="forgot-container">
  <div class="forgot-card">
    <h2>WHODAS 2.0</h2>
    <p class="subtitle">Recupero password</p>

    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle me-2"></i>
      Se l'email è registrata, riceverai le istruzioni per reimpostare la password.
    </div>

    <form *ngIf="!success" (ngSubmit)="onSubmit()" [formGroup]="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [ngClass]="{'is-invalid': submitted && f['email'].errors}"
          placeholder="Inserisci la tua email"
          autocomplete="email"
        >
        <div class="field-error" *ngIf="submitted && f['email'].errors">
          <span *ngIf="f['email'].errors['required']">Email obbligatoria</span>
          <span *ngIf="f['email'].errors['email']">Formato email non valido</span>
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Invia link reset</span>
      </button>
      <button type="button" class="btn btn-outline-secondary mt-2" (click)="goLogin()">
        Torna al login
      </button>
    </form>
  </div>
</div>
