<div class="reset-container">
  <div class="reset-card">
    <h2>WHODAS 2.0</h2>
    <p class="subtitle">Imposta nuova password</p>

    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle me-2"></i>
      Password reimpostata con successo. Puoi ora accedere con la nuova password.
    </div>

    <form *ngIf="!success && token" (ngSubmit)="onSubmit()" [formGroup]="resetForm" novalidate>
      <div class="form-group">
        <label for="newPassword">Nuova password</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="form-control"
          [ngClass]="{'is-invalid': submitted && f['newPassword'].errors}"
          placeholder="Inserisci nuova password"
          autocomplete="new-password"
        >
        <div class="field-error" *ngIf="submitted && f['newPassword'].errors">
          <span *ngIf="f['newPassword'].errors['required']">Password obbligatoria</span>
          <span *ngIf="f['newPassword'].errors['minlength']">Minimo 6 caratteri</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Conferma password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
          [ngClass]="{'is-invalid': submitted && f['confirmPassword'].errors}"
          placeholder="Conferma nuova password"
          autocomplete="new-password"
        >
        <div class="field-error" *ngIf="submitted && f['confirmPassword'].errors">
          <span *ngIf="f['confirmPassword'].errors['required']">Conferma obbligatoria</span>
          <span *ngIf="f['confirmPassword'].errors['mismatch']">Le password non coincidono</span>
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Reimposta password</span>
      </button>
      <button type="button" class="btn btn-outline-secondary mt-2" (click)="goLogin()">
        Torna al login
      </button>
    </form>

    <div *ngIf="!success && !token" class="text-center">
      <div class="alert alert-danger">
        Token di reset mancante o non valido
      </div>
      <button type="button" class="btn btn-outline-secondary mt-2" (click)="goLogin()">
        Torna al login
      </button>
    </div>
  </div>
</div>
