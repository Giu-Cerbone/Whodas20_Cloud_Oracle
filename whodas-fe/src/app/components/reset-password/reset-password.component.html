<div class="reset-container">
  <div class="reset-card" *ngIf="!showResult">
    <h2><i class="fas fa-stethoscope me-2"></i>WHODAS 2.0</h2>
    <h2 class="subtitle">Reset Password</h2>
    <hr class="form-separator" style="margin-bottom: 24px;">
    <div class="form-row">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" readonly />
    </div>
    <div class="form-row">
      <label>Password temporanea</label>
      <input type="text" [(ngModel)]="tempPassword" readonly />
    </div>
    <hr class="form-separator" style="margin-bottom: 24px;">
    <div class="button-row">
      <button class="btn btn-primary" (click)="showConfirm = true">Conferma Password Temporanea</button>
    </div>
  </div>

  <div class="confirm-modal" *ngIf="showConfirm">
    <div class="confirm-backdrop" (click)="showConfirm = false"></div>
    <div class="confirm-dialog">
      <p>Sei sicuro di voler confermare la password temporanea visualizzata?</p>
      <div class="button-row">
        <button class="btn btn-secondary" (click)="showConfirm = false">Annulla</button>
        <button class="btn btn-primary" (click)="onConfirm()">Conferma</button>
      </div>
    </div>
  </div>

  <div class="result-modal" *ngIf="showResult">
    <div class="result-backdrop" (click)="showResult = false"></div>
    <div class="result-dialog">
      <p>{{ resultMessage }}</p>
      <div class="button-row">
        <button class="btn btn-primary" (click)="showResult = false; router.navigate(['/login'])">OK</button>
      </div>
    </div>
  </div>
</div>
